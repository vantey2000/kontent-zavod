<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; frame-src 'self'; connect-src https://tvoy-den-api.aivan-loginov.workers.dev https://karusel-api.aivan-loginov.workers.dev https://skorochtenie-api.aivan-loginov.workers.dev https://uniq-api.aivan-loginov.workers.dev https://kortizol-api.aivan-loginov.workers.dev https://para-api.aivan-loginov.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0b0b0e">
<title>Все админки</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Общая админка (26.10.2026): страница сама не прокручивается, прокручивается сводка или админка продукта внутри вкладки */
  html, body { height: 100%; overflow: hidden; }
  .shell { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .bar { flex: none; padding: max(10px, env(safe-area-inset-top)) 12px 8px; border-bottom: 1px solid var(--rule); background: var(--bg); }
  .bar .t { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bar .logo { font-size: 21px; }
  .bar .sub { font-size: 11.5px; color: var(--muted); }
  .bar .tabs { flex-wrap: nowrap; overflow-x: auto; margin: 8px -12px 0; padding: 0 12px 2px; scrollbar-width: none; }
  .bar .tabs::-webkit-scrollbar { display: none; }
  .bar .tabs button { padding: 8px 13px; font-size: 13.5px; }
  .bar .tabs button i { font-style: normal; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); margin-left: 6px; vertical-align: 1px; }
  .bar .tabs button i.ok { background: var(--ok); } .bar .tabs button i.warn { background: var(--warn); } .bar .tabs button i.bad { background: var(--bad); }
  main { flex: 1; min-height: 0; position: relative; }
  .pane { position: absolute; inset: 0; }
  .pane.sum { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .pane iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  .total { background: linear-gradient(135deg, #221c10, #15151a 60%); border: 1px solid #4a3c1e; border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .total h2 { font: 600 18px/1.2 var(--serif); color: var(--gold-hi); margin-bottom: 10px; }
  .m3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .m3 b { display: block; font-size: clamp(15px, 4.4vw, 20px); font-weight: 800; letter-spacing: -.01em; white-space: nowrap; }
  .m3 span { font-size: 12px; color: var(--muted); }
  .total .m3 b { font-size: clamp(16px, 5vw, 24px); color: var(--gold-hi); }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
  .pcard { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .pcard .ph b { font-size: 16px; display: block; }
  .pcard .ph span { font-size: 12px; color: var(--muted); }
  .pcard .facts { font-size: 13px; color: var(--muted); display: flex; gap: 4px 12px; flex-wrap: wrap; }
  .pcard .facts span b { color: var(--fg); }
  .pcard .st { font-size: 12.5px; }
  .pcard .st.warn { color: var(--warn); } .pcard .st.bad { color: var(--bad); } .pcard .st.ok { color: var(--ok); }
  .pcard .keyin { display: flex; gap: 6px; }
  .pcard .keyin input { font-size: 14px; min-height: 40px; }
  .pcard .go { align-self: flex-start; }
  .skel b { color: var(--dim); }
  .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
</style>
</head>
<body>
<div class="shell">
  <div class="bar">
    <div class="t">
      <div><div class="logo">Все <i>админки</i></div><div class="sub" id="loaded">загружаю…</div></div>
      <button class="btn ghost sm" id="reload">Обновить</button>
    </div>
    <div class="tabs" id="tabs" role="tablist"><button data-tab="sum" class="on">Сводка</button></div>
  </div>
  <main id="main">
    <section class="pane sum" data-pane="sum">
      <div class="wrap" style="padding-top:12px">
        <div class="total">
          <h2>Все продукты</h2>
          <div class="m3" id="total"></div>
          <div class="hint" id="totalhint" style="margin-top:8px"></div>
        </div>
        <div class="pgrid" id="cards"></div>
        <div class="hint">Деньги - оплаты кассы без твоих проверочных оплат, по дням Москвы. «Открыть админку» открывает админку продукта целиком здесь же, со всеми кнопками. Цифры подтягиваются при открытии страницы и по «Обновить»</div>
        <div class="links"><a class="btn ghost sm" href="https://id.prodamus.ru/login" target="_blank" rel="noopener">Кабинет кассы Продамус</a></div>
      </div>
    </section>
  </main>
</div>
<script type="module" src="hub.js"></script>
</body>
</html>
