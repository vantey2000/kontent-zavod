<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E1422">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Планер">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Планер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Ежедневник-хронограф: шкала часов как лист ежедневника, красная стрелка «сейчас» */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E8ECF3; --ink:#121826; --muted:#5D6880; --rule:#DCE2EB;
  --signal:#E5433A; --accent:#2F5FD0; --accent-soft:#E2E9FB; --mint:#1C9A68; --amber:#B4701C; --amber-soft:#F7ECDD;
  --shadow:0 10px 30px rgba(18,24,38,.10);
  --f-display:"Oswald","Arial Narrow",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ppm:1.3px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0E1422; --surface:#161E30; --surface-2:#1E2840; --ink:#E9EEF8; --muted:#8C98B0; --rule:#243049;
  --signal:#FF5A4E; --accent:#86A9FF; --accent-soft:#1F2C4C; --mint:#5BD6A4; --amber:#F2B968; --amber-soft:#3A2E1C;
  --shadow:0 12px 34px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* шапка */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:14px}
.date{display:flex;align-items:flex-end;gap:10px}
.dnum{font-family:var(--f-display);font-weight:600;font-size:64px;line-height:.82;letter-spacing:-.02em}
.dmeta{display:flex;flex-direction:column;padding-bottom:3px}
.dwk{font-family:var(--f-display);font-weight:500;font-size:18px;text-transform:uppercase;letter-spacing:.06em}
.dmon{color:var(--muted);font-size:14px}
.ring{position:relative;width:56px;height:56px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px}
.sync{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--mint);display:inline-block}
.sync.stale i{background:var(--amber)}
.synctg{font-family:var(--f-mono);font-size:11px;color:var(--accent);text-decoration:underline;text-underline-offset:2px;margin-left:4px}
.synctg[hidden]{display:none}

/* вчера на «Сегодня» */
.yday{width:100%;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:10px 14px;margin-bottom:10px;text-align:left}
.yday span{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.yday b{font-weight:600;font-size:14px;flex:1}
.yday i{font-style:normal;color:var(--muted)}

/* виды */
.view{display:none;padding-top:16px;padding-bottom:96px}
.view.on{display:block;animation:rise .28s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}}
.h2{font-family:var(--f-display);font-weight:500;font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;display:flex;justify-content:space-between}
.h2 span{font-family:var(--f-mono);letter-spacing:0}

/* карточка «дальше» */
.next{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.next .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.next .ttl{font-weight:600;font-size:17px;line-height:1.25;margin-top:2px}
.next .when{font-family:var(--f-mono);font-size:13px;color:var(--accent);margin-top:3px}
.next .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.next.hard .dot{background:var(--signal)} .next.hard .when{color:var(--signal)}

/* таймлайн */
.tl{position:relative;margin-top:14px}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--rule)}
.hr span{position:absolute;left:0;top:-8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--bg);padding-right:6px}
.blk{position:absolute;left:52px;right:0;border-radius:12px;padding:6px 10px;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:1px;
  background:var(--accent-soft);border-left:3px solid var(--accent);transition:transform .12s}
.blk:active{transform:scale(.985)}
.blk .t{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.blk .n{font-weight:600;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:var(--surface);color:var(--muted)}
.blk.hard{background:var(--surface);border-left-color:var(--signal);box-shadow:var(--shadow)}
.blk.hard .t{color:var(--signal)}
.blk.small{background:var(--amber-soft);border-left-color:var(--amber)}
.blk.small .n{white-space:normal;font-weight:500;font-size:14px}
.blk.star .tags .tag:first-child{background:var(--accent);color:var(--surface)}
.blk.short{flex-direction:row;align-items:center;gap:8px;padding:0 10px}
.blk.short .n{font-size:14px;white-space:nowrap}
.blk.short .t{white-space:nowrap;flex:none}
.blk.done{opacity:.45}
.blk.done .n{text-decoration:line-through}
.travel{position:absolute;left:52px;right:0;border-radius:10px 10px 0 0;
  background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--signal) 18%,transparent) 6px 12px);
  font-family:var(--f-mono);font-size:10px;color:var(--signal);padding:3px 10px}
.now{position:absolute;left:44px;right:0;height:0;border-top:2px solid var(--signal);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--signal)}
.now b{position:absolute;left:-46px;top:-9px;font-family:var(--f-mono);font-size:11px;color:#fff;background:var(--signal);padding:1px 4px;border-radius:4px}
.empty{color:var(--muted);text-align:center;padding:36px 12px;line-height:1.5}
.empty b{display:block;font-family:var(--f-display);font-weight:500;font-size:20px;color:var(--ink);margin-bottom:6px;letter-spacing:.02em}

/* неделя */
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;padding:2px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{scroll-snap-align:start;flex:none;width:58px;border-radius:16px;background:var(--surface);padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.day .w{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase}
.day .d{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1}
.day .bar{width:30px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.day .bar i{display:block;height:100%;background:var(--accent)}
.day .bar i.full{background:var(--amber)}
.day.sel{background:var(--ink);color:var(--bg)}
.day.sel .w{color:inherit;opacity:.7}
.day.today .d{color:var(--signal)} .day.sel.today .d{color:var(--signal)}
/* прошлые дни: полоска = доля сделанного */
.day.past{background:transparent;border:1px solid var(--rule)}
.day.past .d{color:var(--muted)}
.day.past.sel{background:var(--ink);border-color:var(--ink)} .day.past.sel .d{color:var(--bg)}
.day .bar i.dn{background:var(--mint)}
.day .cnt{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-top:2px}
.day.sel .cnt{color:inherit;opacity:.75}
.sep{flex:none;width:1px;margin:10px 0;background:var(--rule)}
.dyn{margin-top:14px;padding:12px 14px;border-radius:14px;border:1px dashed var(--rule);font-size:14px;color:var(--muted);line-height:1.4}
.dyn b{color:var(--ink)}
/* история: значок состояния вместо цветной точки */
.row.hist .hk{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--rule)}
.row.st-done .hk{background:var(--mint);border-color:var(--mint)}
.row.st-done .hk::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.row.st-missed .hk{border-color:var(--amber)}
.row.st-missed .sub{color:var(--amber)}
.row.st-cancelled,.row.st-gone{opacity:.45} .row.st-cancelled .ttl,.row.st-gone .ttl{text-decoration:line-through}
.agenda{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.row .tm{font-family:var(--f-mono);font-size:13px;width:46px;flex:none;color:var(--muted)}
.row .ttl{flex:1;min-width:0;line-height:1.3}
.row .sub{font-size:12px;color:var(--muted)}
.row .k{width:8px;height:8px;border-radius:50%;flex:none;background:var(--accent)}
.row.hard .k{background:var(--signal)} .row.small .k{background:var(--amber)}
.row.done{opacity:.45} .row.done .ttl{text-decoration:line-through}

/* списки */
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--rule);flex:none;display:grid;place-items:center}
.chk.on{background:var(--mint);border-color:var(--mint)}
.chk.on::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.list{display:flex;flex-direction:column;gap:6px}
.row.gone{opacity:.4;text-decoration:line-through}

/* низ: вкладки и плюс */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:flex;padding:6px max(10px,env(safe-area-inset-left,0px)) 6px max(10px,env(safe-area-inset-right,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:12px;font-weight:500}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--signal)}
.fab{position:fixed;z-index:21;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:18px;background:var(--signal);color:#fff;font-size:30px;line-height:1;box-shadow:0 10px 24px color-mix(in srgb,var(--signal) 40%,transparent);display:grid;place-items:center}
.fab:active{transform:scale(.95)}

/* шторка */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(5,8,15,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  background:var(--surface);border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));box-shadow:var(--shadow)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 14px}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h3{margin:0;font-size:21px;line-height:1.25;font-weight:600}
.sheet .meta{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-top:6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.btn{border-radius:14px;padding:14px 12px;background:var(--surface-2);font-weight:600;font-size:15px;text-align:center}
.btn.pri{background:var(--ink);color:var(--bg);grid-column:1/-1}
.btn.warn{color:var(--signal)}
.btn.warn.arm{background:var(--signal);color:#fff}
.btn.wide{grid-column:1/-1}
/* правка дела */
.fl{display:block;font-family:var(--f-display);font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:16px}
textarea.ed{min-height:72px;margin-top:8px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inp{width:100%;min-width:0;margin-top:8px;border-radius:12px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:11px 10px;min-height:46px;-webkit-appearance:none;appearance:none}
.tbox{position:relative}
.tbox .inp{padding-right:40px}
.clr{position:absolute;right:4px;top:12px;width:36px;height:38px;border-radius:10px;color:var(--muted);font-size:15px}
#edDur{margin-top:8px}
textarea{width:100%;min-height:96px;border-radius:14px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;padding:12px;resize:none;margin-top:12px}
.hint{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.4}

/* напоминания в карточке */
.rsec{margin-top:18px;border-top:1px solid var(--rule);padding-top:14px}
.rl{font-family:var(--f-display);font-weight:500;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border-radius:999px;padding:9px 14px;background:var(--surface-2);font-size:14px;font-weight:500}
.chip.on{background:var(--signal);color:#fff}
.rbox{display:flex;gap:8px;margin-top:10px;align-items:stretch}
.rbox[hidden]{display:none}
.rbox input{flex:1;min-width:0;border-radius:12px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;padding:10px}
.rbox .btn{flex:none;padding:10px 16px}
.rnow{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:10px}

/* идеи */
.ideas{display:flex;flex-direction:column;gap:8px}
.idea{background:var(--surface);border-radius:16px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--amber)}
.idea .it{font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.idea .id{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* замок и тост */
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
.lock.on{display:flex}
.lock b{font-family:var(--f-display);font-weight:600;font-size:28px;letter-spacing:.02em}
.lock p{margin:0;color:var(--muted);max-width:30ch;line-height:1.45}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:40;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;transition:all .25s;pointer-events:none;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.skel{height:420px;border-radius:18px;background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.2s infinite linear;margin-top:16px}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div id="app">
  <div class="wrap">
    <header class="top">
      <div class="date"><span class="dnum" id="dnum">··</span><div class="dmeta"><span class="dwk" id="dwk">планер</span><span class="dmon" id="dmon"></span></div></div>
      <div class="ring" aria-label="Сделано сегодня">
        <svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="none" stroke="var(--rule)" stroke-width="5"/>
          <circle id="ringArc" cx="28" cy="28" r="24" fill="none" stroke="var(--mint)" stroke-width="5" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="150.8"/></svg>
        <b id="ringTxt">0/0</b>
      </div>
    </header>
    <div class="sync" id="sync"><i></i><span id="syncTxt">загружаю…</span><button class="synctg" id="syncTg" hidden>через Telegram</button></div>

    <section class="view on" id="v-today"><div class="skel"></div></section>
    <section class="view" id="v-week"></section>
    <section class="view" id="v-lists"></section>
    <section class="view" id="v-ideas"></section>
  </div>

  <button class="fab" id="fab" aria-label="Добавить дело">+</button>
  <nav class="tabs" aria-label="Разделы"><div class="in">
    <button class="tab on" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Сегодня</button>
    <button class="tab" data-v="lists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>Списки</button>
    <button class="tab" data-v="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Неделя</button>
    <button class="tab" data-v="ideas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg>Идеи</button>
  </div></nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="in" id="sheetIn"></div></div>
  <div class="lock" id="lock"><b>Планер</b><p id="lockTxt">Открой планер кнопкой «📱 Планер» в чате с ботом</p></div>
  <div class="toast" id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
