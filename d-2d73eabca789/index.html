<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#100e0b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<title>А. Иван</title>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#100e0b;
font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#ece5d8}
.lock{display:none;flex-direction:column;align-items:center;gap:18px;padding:24px}
.ring{width:88px;height:88px;border-radius:26px;border:3px solid rgba(217,167,90,.5);
display:grid;place-items:center;font-weight:800;font-size:34px;color:#d9a75a;
letter-spacing:-2px;background:radial-gradient(circle at 30% 25%,#2a2318,#100e0b 75%)}
.wm{font-size:13px;font-weight:700;letter-spacing:.14em;color:#d9a75a}
form{display:flex;gap:10px}
input{background:#1e1a15;border:1px solid #322b21;border-radius:99px;padding:12px 18px;
color:#ece5d8;font-size:16px;outline:none;width:190px}
input:focus{border-color:#d9a75a}
button{background:#d9a75a;color:#171208;border:none;border-radius:99px;padding:12px 20px;
font-weight:700;font-size:14px;cursor:pointer}
.err{font-size:12px;color:#c9543f;min-height:16px}
</style></head><body>
<div class="lock" id="lock">
  <div class="ring">АИ</div><div class="wm">А. ИВАН</div>
  <form id="f"><input id="p" type="password" placeholder="Пароль" autocomplete="current-password">
  <button>Открыть</button></form>
  <div class="err" id="err"></div>
</div>
<script>
// Данные лежат отдельно (data.json) и тянутся СВЕЖИМИ при каждом открытии:
// ?ts= пробивает кеш GitHub Pages (10 мин), no-store - кеш Safari/PWA
var DATA = null;
var B = function(s){return Uint8Array.from(atob(s), function(c){return c.charCodeAt(0)})};
function loadData(){return fetch('data.json?ts='+Date.now(),{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function show(html){localStorage.setItem('aivan_iv',DATA.iv);
  document.open();document.write(html);document.close()}
function dec(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:B(DATA.iv)},key,B(DATA.ct))
  .then(function(pt){return new TextDecoder().decode(pt)})}
function fromPass(p){return crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey'])
  .then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:B(DATA.salt),iterations:310000,hash:'SHA-256'},
  km,{name:'AES-GCM',length:256},true,['decrypt'])})}
window.addEventListener('load',function(){
  var fallback = function(){document.getElementById('lock').style.display='flex';
    document.getElementById('p').focus()};
  loadData().then(function(d){
    DATA = d;
    var k = localStorage.getItem('aivan_k');
    if(k){crypto.subtle.importKey('raw',B(k),{name:'AES-GCM'},false,['decrypt'])
      .then(dec).then(show).catch(fallback)}else{fallback()}
  }).catch(function(){document.getElementById('lock').style.display='flex';
    document.getElementById('err').textContent='Нет сети - открой ещё раз с интернетом'});
});
document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  if(!DATA)return;
  var key;
  fromPass(document.getElementById('p').value)
    .then(function(kk){key=kk;return dec(kk)})
    .then(function(html){
      crypto.subtle.exportKey('raw',key).then(function(raw){
        localStorage.setItem('aivan_k',btoa(String.fromCharCode.apply(null,new Uint8Array(raw))));
        show(html)})})
    .catch(function(){document.getElementById('err').textContent='Не подошёл - попробуй ещё раз'});
});
</script></body></html>
